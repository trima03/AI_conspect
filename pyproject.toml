[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-conspect"
version = "0.1.0"
description = "Local desktop app for lecture transcription and AI notes"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "imageio-ffmpeg>=0.6,<1", "sounddevice>=0.5,<1"]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]
mac = ["mlx-whisper>=0.4.3,<0.5; sys_platform == 'darwin' and platform_machine == 'arm64'"]
cpu = ["faster-whisper>=1.1,<2"]
notes-mac = ["mlx-lm>=0.30,<0.31; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
transcribe-lesson = "konspekt.transcribe:main"
record-lesson = "konspekt.record:main"
summarize-lesson = "konspekt.summarize:main"
aikonspekt = "konspekt.ui.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
