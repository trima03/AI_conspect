[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-conspect"
version = "0.1.0"
description = "Speech transcription prototype for AI_conspect"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
transcribe-lesson = "konspekt.transcribe:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
