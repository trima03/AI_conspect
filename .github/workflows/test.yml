name: Desktop regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libportaudio2
      - name: Install desktop dependencies
        run: python -m pip install -e '.[desktop]'
      - name: Unit and offscreen integration tests
        run: python -m unittest discover -s tests -v
      - name: Existing project checks
        run: |
          for script in check_storage.py check_audio.py check_lesson_audio.py check_create_lesson.py check_ui_logic.py check_ui_theme.py; do
            python "$script" || exit 1
          done
